approval_policy = "never"
sandbox_mode = "danger-full-access"
model_context_window = 900_000
model = "gpt-6-astra"
model_reasoning_summary = "detailed"
show_raw_agent_reasoning = true
developer_instructions = "For introspection questions about Codex, ChatGPT, or OpenAI, inspect `~/code/github.com/openai/`. Use the confetti effect when there's something truly worth celebrating."
service_tier = "priority"
approvals_reviewer = "auto_review"
personality = "friendly"
plan_mode_reasoning_effort = "xhigh"
model_reasoning_effort = "ultra"

[mcp_servers.atuin]
command = "atuin"
args = [ "mcp" ]

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.fff.tools.find_files]
approval_mode = "approve"

[mcp_servers.fff.tools.multi_grep]
approval_mode = "approve"

[mcp_servers.fff.tools.grep]
approval_mode = "approve"

[mcp_servers.Chrome-DevTools]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--channel=dev",
  "--headless=true",
  "--chromeArg=--remote-debugging-port=9222",
  "--chromeArg=--remote-debugging-address=127.0.0.1",
  "--chromeArg=--remote-allow-origins=http://127.0.0.1:9223,http://localhost:9223",
  "--userDataDir=/home/max.coplan/.cache/sa-tea-chrome-profile",
  "--experimental-devtools=true",
  "--experimental-vision=true",
  "--experimental-structured-content=true",
  "--experimental-include-all-pages=true",
  "--experimental-screencast=true",
  "--category-experimental-webmcp=true",
  "--category-experimental-third-party=true",
  "--category-extensions=true"
]
startup_timeout_sec = 60

[mcp_servers.Chrome-DevTools-Attached]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--browserUrl=http://127.0.0.1:9222"
]
startup_timeout_sec = 60

[mcp_servers.dayflow]
command = "start-mcp-else-empty"
args = [ "dayflow", "mcp" ]

[tui]
terminal_title = [ "project-name", "activity", "thread-title" ]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "pull-request-number",
  "run-state",
  "permissions",
  "context-used",
  "five-hour-limit",
  "weekly-limit"
]
screen_reader_detection_done = true

  [tui.model_availability_nux]
  gpt-6-astra = 4
  "gpt-6.1-sol" = 4

[features]
hooks = true
codex_hooks = true
reasoning_effort_override = true
memories = true
chronicle = true
prevent_idle_sleep = true
multi_agent_v2 = true
code_mode = true
code_mode_interrupt = true
runtime_metrics = true
step_model_switching = true
external_agent_memory_import = true

  [features.context_management]
  experimental_mode = true

[desktop]
followUpQueueMode = "steer"
# Selects how much step, command, and execution detail appears in conversations.
conversationDetailMode = "STEPS_COMMANDS"
# Shows context-window usage in the message composer.
show-context-window-usage = true
toys-confetti-enabled = true
toys-audio-visualizer-enabled = true
external-agent-import-sync-item-types = "all"
dock-icon-preference = "codex-system"
usePointerCursors = true
sansFontSize = 16
codeFontSize = 14
browser-show-full-url = true
worktree-upstream-refresh-mode = "best-effort"
git-pr-watch-auto-merge = true
preventSleepWhileRunning = true
git-pull-request-merge-method = "squash"
agent-usage-reset-enabled = true

  [desktop.open-in-target-preferences]
  global = "systemDefault"

[plugins]
"codex-app-tools@openai-bundled" = { }
"documents@openai-primary-runtime" = { }
"pdf@openai-primary-runtime" = { }
"presentations@openai-primary-runtime" = { }
"template-creator@openai-primary-runtime" = { }

  [plugins."browser@openai-bundled"]
  enabled = true

  [plugins."unified-computer-use@openai-bundled"]
  enabled = true

  [plugins."visualize@openai-bundled"]
  enabled = true

  [plugins."computer-use@openai-bundled"]
  enabled = true

  [plugins."spreadsheets@openai-primary-runtime"]
  enabled = true

  [plugins."chrome@openai-bundled"]
  enabled = true

  [plugins."code-review@openai-bundled"]
  enabled = true

  [plugins."computer-history@openai-bundled"]
  enabled = true

[shell_environment_policy]
inherit = "core"

[[skills.config]]
name = "coco-export-location"
enabled = false


[windows]
sandbox = "unelevated"

[projects.'c:\users\max\dotfiles']
trust_level = "trusted"

# Machine-specific config goes on the bottom
