# Shared preferences. Run: uv run bin/sync-codex-config.py
# The sync script resolves {cache_dir} and {temp_dir} for this machine.
model = "gpt-6-astra"
model_reasoning_effort = "medium"
developer_instructions = "For introspection questions about Codex, inspect `~/code/github.com/openai/codex`."
service_tier = "priority"
approvals_reviewer = "auto_review"

[mcp_servers.chrome_devtools]
command = "bun"
args = ["x", "chrome-devtools-mcp@1.8.0", "--channel=dev"]
startup_timeout_sec = 60

[mcp_servers.chrome_devtools.tools.click]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.hover]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.navigate_page]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.new_page]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.resize_page]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.take_screenshot]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.take_snapshot]
approval_mode = "approve"

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.fff.tools.find_files]
approval_mode = "approve"

[mcp_servers.fff.tools.multi_grep]
approval_mode = "approve"

[mcp_servers.fff.tools.grep]
approval_mode = "approve"

[mcp_servers.Chrome-DevTools]
command = "bun"
args = ["x", "chrome-devtools-mcp@1.8.0", "--channel=dev", "--user-data-dir={cache_dir}/chrome-devtools-mcp/chrome-profile-dev", "--log-file={temp_dir}/chrome-devtools-mcp.log", "--experimental-devtools=true", "--experimental-vision=true", "--experimental-structured-content=true", "--experimental-include-all-pages=true", "--experimental-screencast=true", "--category-experimental-webmcp=true", "--category-experimental-third-party=true", "--category-extensions=true"]
startup_timeout_sec = 60

[mcp_servers.Chrome-DevTools-Attached]
command = "bun"
args = ["x", "chrome-devtools-mcp@1.8.0", "--autoConnect", "--channel=dev", "--log-file={temp_dir}/chrome-devtools-mcp-attached.log"]
startup_timeout_sec = 60

[mcp_servers.bytedcli]
command = "bytedcli"
args = [ "mcp" ]

[mcp_servers.dayflow]
command = "dayflow"
args = [ "mcp" ]

[features]
hooks = true
memories = true
chronicle = true

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
show-context-window-usage = true
toys-confetti-enabled = true
toys-audio-visualizer-enabled = true
external-agent-import-sync-enabled = false
external-agent-import-sync-item-types = "all"
appearanceTheme = "system"
appearanceLightCodeThemeId = "codex"
dock-icon-preference = "codex-system"
usePointerCursors = true
sansFontSize = 16
codeFontSize = 14
appearanceDiffMarkerStyle = "color"
browser-show-full-url = true

[desktop.open-in-target-preferences]
global = "systemDefault"

[desktop.appearanceLightChromeTheme]
accent = "#0169cc"
accentSource = "chatgpt"
contrast = 45
ink = "#0d0d0d"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#e02e2a"
skill = "#751ed9"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."computer-history@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[shell_environment_policy]
inherit = "core"


[memories]
generate_memories = true
use_memories = true

[[skills.config]]
name = "coco-export-location"
enabled = false
