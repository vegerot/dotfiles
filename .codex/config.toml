  "x",
  "chrome-devtools-mcp@1.9.0",
  "--channel=dev",
  "--headless=true",
  "--chromeArg=--remote-debugging-port=9222",
  "--chromeArg=--remote-debugging-address=127.0.0.1",
  "--chromeArg=--remote-allow-origins=http://127.0.0.1:9223,http://localhost:9223",
  "--userDataDir=/home/max.coplan/.cache/sa-tea-chrome-profile",
  "--experimental-devtools=true",
  "--experimental-vision=true",
  "--experimental-structured-content=true",
  "--experimental-include-all-pages=true",
  "--experimental-screencast=true",
  "--category-experimental-webmcp=true",
  "--category-experimental-third-party=true",
  "--category-extensions=true"
]
startup_timeout_sec = 60

[mcp_servers.Chrome-DevTools-Attached]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--browserUrl=http://127.0.0.1:9222"
]
startup_timeout_sec = 60

[mcp_servers.dayflow]
