approval_policy = "never"
sandbox_mode = "danger-full-access"
model_context_window = 900000
model = "gpt-6-sol"
model_reasoning_effort = "low"
model_reasoning_summary = "detailed"
show_raw_agent_reasoning = true
developer_instructions = "For introspection questions about Codex, ChatGPT, or OpenAI, inspect `~/code/github.com/openai/`."
service_tier = "default"
approvals_reviewer = "auto_review"
personality = "friendly"

[mcp_servers.atuin]
command = "atuin"
args = [ "mcp" ]

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.fff.tools.find_files]
approval_mode = "approve"

[mcp_servers.fff.tools.multi_grep]
approval_mode = "approve"

[mcp_servers.fff.tools.grep]
approval_mode = "approve"

[mcp_servers.Chrome-DevTools]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--channel=dev",
  "--experimental-devtools=true",
  "--experimental-vision=true",
  "--experimental-structured-content=true",
  "--experimental-include-all-pages=true",
  "--experimental-screencast=true",
  "--category-experimental-webmcp=true",
  "--category-experimental-third-party=true",
  "--category-extensions=true"
]
startup_timeout_sec = 60

[mcp_servers.Chrome-DevTools-Attached]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--autoConnect",
  "--channel=dev"
]
startup_timeout_sec = 60

[mcp_servers.dayflow]
command = "start-mcp-else-empty"
args = [ "dayflow", "mcp" ]

[tui]
terminal_title = ["project-name", "activity", "thread-title"]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "pull-request-number",
  "run-state",
  "permissions",
  "context-used",
  "five-hour-limit",
  "weekly-limit"
]
screen_reader_detection_done = true

  [tui.model_availability_nux]
  gpt-6-astra = 4

[features]
# Preserves the request-level reasoning baseline and appends effort updates on supported OpenAI models to retain cache reuse.
reasoning_effort_override = true
memories = true
# Enables the Chronicle sidecar for passive screen-context memories.
chronicle = true
prevent_idle_sleep = true
# Enables task-path-based routing for cooperating agents.
multi_agent_v2 = true
code_mode = true
# Terminates active code-mode cells when their turn is interrupted.
code_mode_interrupt = true
# Enables runtime metric snapshots for inspection by a metrics reader.
runtime_metrics = true
# Allows explicitly requested model changes to take effect in later steps of a turn.
step_model_switching = true
# Enables importing project-scoped memories from other agents.
external_agent_memory_import = true

[features.context_management]
experimental_mode = true

[desktop]
# Controls whether follow-up messages steer, queue behind, or interrupt the active turn.
followUpQueueMode = "steer"
# Selects how much step, command, and execution detail appears in conversations.
conversationDetailMode = "STEPS_PROSE"
# Shows context-window usage in the message composer.
show-context-window-usage = true
# Allows the app to display confetti celebrations.
toys-confetti-enabled = true
# Makes conversation navigation rails react to system playback audio.
toys-audio-visualizer-enabled = true
# Chooses which imported content categories stay in sync, with all including categories discovered later.
external-agent-import-sync-item-types = "all"
# Selects the preferred macOS Dock icon.
dock-icon-preference = "codex-system"
# Uses pointer cursors over interactive controls.
usePointerCursors = true
# Sets the base user-interface font size.
sansFontSize = 16
# Sets the code font size.
codeFontSize = 14
# Shows the full URL in the in-app browser address bar.
browser-show-full-url = true
# Controls whether upstream branches are refreshed before creating a worktree.
worktree-upstream-refresh-mode = "best-effort"
# Controls whether watched pull requests are merged when ready.
git-pr-watch-auto-merge = true
# Keeps the machine awake while Codex is running.
preventSleepWhileRunning = true
git-pull-request-merge-method = "squash"

  [desktop.open-in-target-preferences]
  # Selects the default application target for opening filesystem paths.
  global = "systemDefault"

[plugins."codex-app-tools@openai-bundled"]

[plugins."browser@openai-bundled"]

[plugins."unified-computer-use@openai-bundled"]

[plugins."visualize@openai-bundled"]

[plugins."computer-use@openai-bundled"]

[plugins."documents@openai-primary-runtime"]

[plugins."pdf@openai-primary-runtime"]

[plugins."spreadsheets@openai-primary-runtime"]

[plugins."presentations@openai-primary-runtime"]

[plugins."template-creator@openai-primary-runtime"]

[plugins."computer-history@openai-bundled"]

[plugins."chrome@openai-bundled"]

[shell_environment_policy]
inherit = "core"

[[skills.config]]
# Selects the skill by name rather than by its filesystem path.
name = "coco-export-location"
enabled = false

# Machine-specific config goes on the bottom

