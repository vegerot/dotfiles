approval_policy = "never"
sandbox_mode = "danger-full-access"
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
developer_instructions = "For introspection questions about Codex, inspect `~/code/github.com/openai/codex`."
service_tier = "priority"
approvals_reviewer = "auto_review"


[mcp_servers.atuin]
command = "atuin"
args = ["mcp"]
[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.fff.tools.find_files]
approval_mode = "approve"

[mcp_servers.fff.tools.multi_grep]
approval_mode = "approve"

[mcp_servers.fff.tools.grep]
approval_mode = "approve"

[mcp_servers.Chrome-DevTools]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--channel=dev",
  "--experimental-devtools=true",
  "--experimental-vision=true",
  "--experimental-structured-content=true",
  "--experimental-include-all-pages=true",
  "--experimental-screencast=true",
  "--category-experimental-webmcp=true",
  "--category-experimental-third-party=true",
  "--category-extensions=true"
]
startup_timeout_sec = 60

[mcp_servers.Chrome-DevTools-Attached]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--autoConnect",
  "--channel=dev"
]
startup_timeout_sec = 60

[mcp_servers.bytedcli]
command = "start-mcp-else-empty"
args = [ "bytedcli", "mcp" ]

[mcp_servers.dayflow]
command = "start-mcp-else-empty"
args = [ "/Applications/Dayflow.app/Contents/Helpers/dayflow", "mcp" ]

[features]
hooks = true
memories = true
chronicle = true

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
show-context-window-usage = true
toys-confetti-enabled = true
toys-audio-visualizer-enabled = true
external-agent-import-sync-enabled = false
external-agent-import-sync-item-types = "all"
appearanceTheme = "system"
appearanceLightCodeThemeId = "codex"
dock-icon-preference = "codex-system"
usePointerCursors = true
sansFontSize = 16
codeFontSize = 14
appearanceDiffMarkerStyle = "color"
browser-show-full-url = true

  [desktop.open-in-target-preferences]
  global = "systemDefault"

  [desktop.appearanceLightChromeTheme]
  accent = "#0169cc"
  accentSource = "chatgpt"
  contrast = 45
  ink = "#0d0d0d"
  opaqueWindows = false
  surface = "#ffffff"
  fonts = { }

    [desktop.appearanceLightChromeTheme.semanticColors]
    diffAdded = "#00a240"
    diffRemoved = "#e02e2a"
    skill = "#751ed9"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."computer-history@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[shell_environment_policy]
inherit = "core"

[memories]
generate_memories = true
use_memories = true

[[skills.config]]
name = "coco-export-location"
enabled = false

[projects."/Users/bytedance/code/github.com/anomalyco/opencode"]
trust_level = "trusted"

[projects."/Users/bytedance/code/github.com/vegerot/ai-conversations"]
trust_level = "trusted"

[projects."/Users/bytedance/Documents/Codex/2026-09-08/ex"]
trust_level = "trusted"

[projects."/Users/bytedance/code/github.com/vegerot/dotfiles"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "pull-request-number", "run-state", "permissions", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[tui.model_availability_nux]
gpt-6-astra = 4
