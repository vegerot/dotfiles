# Shared user config, symlinked from ~/.codex/config.toml by bootstrap.sh.
model = "gpt-6-astra"
model_reasoning_effort = "medium"
developer_instructions = "For introspection questions about Codex, inspect `~/code/github.com/openai/codex`."
service_tier = "priority"
approvals_reviewer = "auto_review"

[mcp_servers.chrome_devtools]
command = "bunx"
args = ["chrome-devtools-mcp@1.8.0", "--channel=dev"]

[mcp_servers.chrome_devtools.tools.click]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.hover]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.navigate_page]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.new_page]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.resize_page]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.take_screenshot]
approval_mode = "approve"

[mcp_servers.chrome_devtools.tools.take_snapshot]
approval_mode = "approve"

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.fff.tools.find_files]
approval_mode = "approve"

[mcp_servers.fff.tools.multi_grep]
approval_mode = "approve"

[mcp_servers.fff.tools.grep]
approval_mode = "approve"

# --channel=dev selects ~/.cache/chrome-devtools-mcp/chrome-profile-dev.
[mcp_servers.Chrome-DevTools]
command = "bunx"
args = ["chrome-devtools-mcp@1.8.0", "--channel=dev", "--log-file=/tmp/chrome-devtools-mcp.log", "--experimental-devtools=true", "--experimental-vision=true", "--experimental-structured-content=true", "--experimental-include-all-pages=true", "--experimental-screencast=true", "--category-experimental-webmcp=true", "--category-experimental-third-party=true", "--category-extensions=true"]

[mcp_servers.Chrome-DevTools-Attached]
command = "bunx"
args = ["chrome-devtools-mcp@1.8.0", "--autoConnect", "--channel=dev", "--log-file=/tmp/chrome-devtools-mcp-attached.log"]

# Missing optional programs use a real MCP handshake with an empty tool list.
# An installed program's failure is still reported; only absence uses the fallback.
[mcp_servers.bytedcli]
command = "start-mcp-else-empty"
args = ["bytedcli", "mcp"]

[mcp_servers.dayflow]
command = "start-mcp-else-empty"
args = ["/Applications/Dayflow.app/Contents/Helpers/dayflow", "mcp"]

[features]
hooks = true
js_repl = true
memories = true
chronicle = true

