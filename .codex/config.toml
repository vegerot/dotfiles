approval_policy = "never"
sandbox_mode = "danger-full-access"
model_context_window = 900000
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
show_raw_agent_reasoning = true
hide_agent_reasoning = false
developer_instructions = "For introspection questions about Codex, inspect `~/code/github.com/openai/`."
service_tier = "priority"
approvals_reviewer = "auto_review"
personality = "friendly"

[mcp_servers.atuin]
command = "atuin"
args = [ "mcp" ]

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.fff.tools.find_files]
approval_mode = "approve"

[mcp_servers.fff.tools.multi_grep]
approval_mode = "approve"

[mcp_servers.fff.tools.grep]
approval_mode = "approve"

[mcp_servers.Chrome-DevTools]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--channel=dev",
  "--experimental-devtools=true",
  "--experimental-vision=true",
  "--experimental-structured-content=true",
  "--experimental-include-all-pages=true",
  "--experimental-screencast=true",
  "--category-experimental-webmcp=true",
  "--category-experimental-third-party=true",
  "--category-extensions=true"
]
startup_timeout_sec = 60

[mcp_servers.Chrome-DevTools-Attached]
command = "bun"
args = [
  "x",
  "chrome-devtools-mcp@1.9.0",
  "--autoConnect",
  "--channel=dev"
]
startup_timeout_sec = 60

[mcp_servers.dayflow]
command = "start-mcp-else-empty"
args = [ "/Applications/Dayflow.app/Contents/Helpers/dayflow", "mcp" ]

[tui]
terminal_title = ["project-name", "activity", "thread-title"]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "pull-request-number",
  "run-state",
  "permissions",
  "context-used",
  "five-hour-limit",
  "weekly-limit"
]
# Colors terminal status-line items using the active syntax theme.
status_line_use_colors = true

  [tui.model_availability_nux]
  gpt-6-astra = 4

[features]
# Preserves the request-level reasoning baseline and appends effort updates on supported OpenAI models to retain cache reuse.
reasoning_effort_override = true
hooks = true
memories = true
# Enables the Chronicle sidecar for passive screen-context memories.
chronicle = true
prevent_idle_sleep = true
# Enables task-path-based routing for cooperating agents.
multi_agent_v2 = true
code_mode = true
# Terminates active code-mode cells when their turn is interrupted.
code_mode_interrupt = true
# Enables runtime metric snapshots for inspection by a metrics reader.
runtime_metrics = true
# Allows explicitly requested model changes to take effect in later steps of a turn.
step_model_switching = true
# Enables importing project-scoped memories from other agents.
external_agent_memory_import = true

[features.context_management]
experimental_mode = true

[desktop]
# Controls whether follow-up messages steer, queue behind, or interrupt the active turn.
followUpQueueMode = "steer"
# Selects how much step, command, and execution detail appears in conversations.
conversationDetailMode = "STEPS_COMMANDS"
# Enables ambient task suggestions on the home page.
ambient-suggestions-enabled = true
# Shows context-window usage in the message composer.
show-context-window-usage = true
# Allows the app to display confetti celebrations.
toys-confetti-enabled = true
# Makes conversation navigation rails react to system playback audio.
toys-audio-visualizer-enabled = true
# Automatically keeps imported content from other agents in sync.
external-agent-import-sync-enabled = false
# Chooses which imported content categories stay in sync, with all including categories discovered later.
external-agent-import-sync-item-types = "all"
# Selects system, light, or dark app appearance.
appearanceTheme = "system"
# Selects the code syntax theme used in light mode.
appearanceLightCodeThemeId = "codex"
# Selects the preferred macOS Dock icon.
dock-icon-preference = "codex-system"
# Uses pointer cursors over interactive controls.
usePointerCursors = true
# Sets the base user-interface font size.
sansFontSize = 16
# Sets the code font size.
codeFontSize = 14
# Chooses colored or symbolic change markers in code review views.
appearanceDiffMarkerStyle = "color"
# Shows the full URL in the in-app browser address bar.
browser-show-full-url = true
# Enables notifications for permission requests.
notifications-permissions-enabled = true
# Chooses the default panel location for terminal tabs.
defaultTerminalLocation = "bottom"
# Shows the app in the macOS menu bar.
mac-menu-bar-enabled = true
# Allows realtime voice to inspect the foreground app when the user refers to screen content.
realtimeVoiceScreenContextEnabled = true
# Controls whether upstream branches are refreshed before creating a worktree.
worktree-upstream-refresh-mode = "best-effort"
# Controls whether watched pull requests are merged when ready.
git-pr-watch-auto-merge = true
# Keeps the machine awake while Codex is running.
preventSleepWhileRunning = true

  [desktop.open-in-target-preferences]
  # Selects the default application target for opening filesystem paths.
  global = "systemDefault"

  [desktop.appearanceLightChromeTheme]
  # Sets the accent color for the light-mode app interface.
  accent = "#0169cc"
  # Selects whether the accent comes from ChatGPT or a custom color.
  accentSource = "chatgpt"
  # Sets light-mode interface contrast on a scale from 0 to 100.
  contrast = 45
  # Sets the foreground ink color for the light-mode interface.
  ink = "#0d0d0d"
  # Controls whether light-mode windows use opaque surfaces.
  opaqueWindows = false
  # Sets the surface background color for the light-mode interface.
  surface = "#ffffff"
  # Stores font overrides for the light-mode interface.
  fonts = { }

    [desktop.appearanceLightChromeTheme.semanticColors]
    # Sets the light-mode color for added code.
    diffAdded = "#00a240"
    # Sets the light-mode color for removed code.
    diffRemoved = "#e02e2a"
    # Sets the light-mode color used for skills.
    skill = "#751ed9"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."computer-history@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[shell_environment_policy]
inherit = "core"

[memories]
generate_memories = true
use_memories = true

[[skills.config]]
# Selects the skill by name rather than by its filesystem path.
name = "coco-export-location"
enabled = false

