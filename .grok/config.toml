[cli]
installer = "internal"
auto_update = true

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
vim_mode = true
max_thoughts_width = 120
yolo = false
compact_mode = false
tool_call_density = "compact-ungrouped"
show_timeline = true
theme = "auto"
follow_up_behavior = "steer"
permission_mode = "always-approve"
hunk_tracker_mode = "agent_only"
confirm_before_rewind = false

[ui.contextual_hints]
send_now = true

[ui.status_line]
type = "command"
command = "~/.grok/statusline.sh"

[privacy]
privacy_banner_acked = "2026-10-13T22:23:03Z"

[models]
default = "grok-4.7-build-fast"
default_reasoning_effort = "high"

[features]
subagent_model_inheritance = true
lsp_tools = true

[compat.claude]
skills = false
rules = false
agents = false
mcps = false
hooks = false

[claude_compat]
imported = true

[mcp_servers.fff]
command = "fff-mcp"

[mcp_servers.dayflow]
command = "/Applications/Dayflow.app/Contents/Helpers/dayflow"
args = ["mcp"]

[model.frontier-throughput-0]
name = "Frontier throughput p=0"
model = "throughput@0"
base_url = "http://localhost:4000/v1"
api_backend = "chat_completions"
context_window = 200000
description = "Fastest eligible model. Quality floor 0."

[[model.frontier-throughput-0.reasoning_efforts]]
value = "none"
label = "None"
description = "No requested reasoning."
